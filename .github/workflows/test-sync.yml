name: Verifica sincronizzazione Excel (senza pubblicazione)

on:
  push:
    branches:
      - test/sync-bidirezionale
    paths:
      - 'Bilancio_Casa_PWA_v0_2_0.zip.b64.part*'
      - 'Bilancio_Casa_PWA_v0_2_0.zip.b64.ready'
      - 'patch_archive.py'
      - '.github/workflows/test-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-excel-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il branch di prova
        uses: actions/checkout@v5

      - name: Ricostruisce e verifica il pacchetto originale
        shell: bash
        run: |
          set -euo pipefail
          test -f Bilancio_Casa_PWA_v0_2_0.zip.b64.ready
          cat Bilancio_Casa_PWA_v0_2_0.zip.b64.part0* | base64 --decode > Bilancio_Casa_PWA_v0_2_0.zip
          echo "394b3317a48742bfed152e9ec1bd00e9b339139fe12a1092a76461a5b43ca9f6  Bilancio_Casa_PWA_v0_2_0.zip" | sha256sum --check
          unzip -tq Bilancio_Casa_PWA_v0_2_0.zip
          python3 patch_archive.py Bilancio_Casa_PWA_v0_2_0.zip
          unzip -tq Bilancio_Casa_PWA_v0_2_0.zip

      - name: Verifica importazione ed esportazione con ID stabili
        shell: bash
        run: |
          set -euo pipefail
          mkdir extracted
          unzip -q Bilancio_Casa_PWA_v0_2_0.zip -d extracted
          APP="extracted/bilancio-casa-pwa/app.js"
          test -f "$APP"
          node --check "$APP"
          python3 - <<'PY'
          from pathlib import Path
          app = Path("extracted/bilancio-casa-pwa/app.js").read_text(encoding="utf-8")
          checks = {
              "export CSV include tutte le colonne": "['ID movimento', 'Data', 'Giorno', 'Concetto', 'Categoria', 'Tipo', 'Importo', 'Importo +/-', 'Saldo', 'Mese', 'Note']" in app,
              "export CSV usa l'ID reale del movimento": "m.id || ''" in app,
              "export CSV calcola importo firmato": "signed(m)" in app,
              "import Excel riconosce ID movimento": "'idmovimento'" in app and "id: find(" in app,
              "import Excel legge le colonne del foglio": all(x in app for x in ["'concetto'", "'categoria'", "'tipo'", "'importo'", "'note'"]),
              "import Excel deduce entrata o uscita dal segno": "signedAmount >= 0 ? 'Entrata' : 'Uscita'" in app,
              "ID stabile aggiorna il record senza duplicarlo": "upsert(part, { onConflict: 'id' })" in app,
              "righe senza ID mantengono la deduplicazione": "onConflict: 'user_id,import_key', ignoreDuplicates: true" in app,
              "ID stabile non riceve un import_key artificiale": "...(hasStableId ? { id: suppliedId } : { import_key:" in app and "id: suppliedId, import_key: `excel-id:${suppliedId}`" not in app,
          }
          for label, ok in checks.items():
              print(("OK" if ok else "ERRORE") + " - " + label)
          failed = [label for label, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("Verifica fallita: " + "; ".join(failed))
          PY

      - name: Espone il sorgente estratto nel solo branch di prova per analisi
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-source
          cp extracted/bilancio-casa-pwa/app.js test-source/app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-source/app.js
          if ! git diff --cached --quiet; then
            git commit -m "Expose extracted app source for sync analysis"
            git push
          fi

      - name: Conserva il pacchetto verificato come artefatto di prova
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Bilancio-Casa-test-sync-bidirezionale
          path: |
            Bilancio_Casa_PWA_v0_2_0.zip
            extracted/bilancio-casa-pwa/app.js
          if-no-files-found: error
          retention-days: 7
