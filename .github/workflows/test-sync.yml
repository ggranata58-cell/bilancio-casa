name: Verifica sincronizzazione Excel (senza pubblicazione)

on:
  push:
    branches:
      - test/sync-bidirezionale
    paths:
      - 'Bilancio_Casa_PWA_v0_2_0.zip.b64.part*'
      - 'Bilancio_Casa_PWA_v0_2_0.zip.b64.ready'
      - 'patch_archive.py'
      - '.github/workflows/test-sync.yml'
      - 'test-source/AggiornaMovimentiDaApp.bas'
      - 'test-source/SincronizzaBilancioSupabase.bas'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-excel-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il branch di prova
        uses: actions/checkout@v5

      - name: Ricostruisce e verifica il pacchetto originale
        shell: bash
        run: |
          set -euo pipefail
          test -f Bilancio_Casa_PWA_v0_2_0.zip.b64.ready
          cat Bilancio_Casa_PWA_v0_2_0.zip.b64.part0* | base64 --decode > Bilancio_Casa_PWA_v0_2_0.zip
          echo "394b3317a48742bfed152e9ec1bd00e9b339139fe12a1092a76461a5b43ca9f6  Bilancio_Casa_PWA_v0_2_0.zip" | sha256sum --check
          unzip -tq Bilancio_Casa_PWA_v0_2_0.zip
          python3 patch_archive.py Bilancio_Casa_PWA_v0_2_0.zip
          unzip -tq Bilancio_Casa_PWA_v0_2_0.zip

      - name: Verifica importazione ed esportazione con ID stabili
        shell: bash
        run: |
          set -euo pipefail
          mkdir extracted
          unzip -q Bilancio_Casa_PWA_v0_2_0.zip -d extracted
          APP="extracted/bilancio-casa-pwa/app.js"
          test -f "$APP"
          node --check "$APP"
          python3 - <<'PY'
          from pathlib import Path
          app = Path("extracted/bilancio-casa-pwa/app.js").read_text(encoding="utf-8")
          checks = {
              "export CSV include tutte le colonne": "['ID movimento', 'Data', 'Giorno', 'Concetto', 'Categoria', 'Tipo', 'Importo', 'Importo +/-', 'Saldo', 'Mese', 'Note']" in app,
              "export CSV usa l'ID reale del movimento": "m.id || ''" in app,
              "export CSV calcola importo firmato": "signed(m)" in app,
              "import Excel riconosce ID movimento": "'idmovimento'" in app and "id: find(" in app,
              "import Excel legge le colonne del foglio": all(x in app for x in ["'concetto'", "'categoria'", "'tipo'", "'importo'", "'note'"]),
              "import Excel deduce entrata o uscita dal segno": "signedAmount >= 0 ? 'Entrata' : 'Uscita'" in app,
              "ID stabile aggiorna il record senza duplicarlo": "upsert(part, { onConflict: 'id' })" in app,
              "righe senza ID mantengono la deduplicazione": "onConflict: 'user_id,import_key', ignoreDuplicates: true" in app,
              "ID stabile usa il ramo condizionale senza sovrascrivere la chiave": "...(hasStableId ? { id: suppliedId } : {})" in app,
              "riepilogo contanti e prelievi presente": all(x in app for x in ["function renderCashPanel()", "cashBalanceInput", "cashMonthWithdrawals", "cashTotalWithdrawals"]),
              "saldo contanti iniziale di 50 euro e salvataggio locale": "'50.00'" in app and "localStorage.setItem(cashBalanceKey()" in app,
              "saldo contanti modificabile con controllo importo": "function saveCashBalance()" in app and "value < 0" in app,
              "solo le categorie esplicitamente escluse escono dalle spese ordinarie": "new Set(['Movimenti esclusi', 'Prelievo contanti'])" in app and "movement_type === 'Uscita' && !isExcludedMovement(m)" in app,
              "Tasas y Intereses conserva il trattamento speciale": "const SPECIAL_CATEGORY = 'Tasas y Intereses';" in app and "else if (m.category === SPECIAL_CATEGORY)" in app,
          }
          for label, ok in checks.items():
              print(("OK" if ok else "ERRORE") + " - " + label)
          failed = [label for label, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("Verifica fallita: " + "; ".join(failed))
          PY

      - name: Verifica macro Excel per sincronizzazione diretta Supabase
        shell: bash
        run: |
          set -euo pipefail
          MACRO="test-source/SincronizzaBilancioSupabase.bas"
          test -f "$MACRO"
          python3 - <<'PY'
          from pathlib import Path
          macro = Path("test-source/SincronizzaBilancioSupabase.bas").read_text(encoding="utf-8")
          checks = {
              "usa il progetto Supabase corretto": "bstcydrgyspgofckzybl.supabase.co" in macro,
              "autenticazione password senza salvare la password": "/auth/v1/token?grant_type=password" in macro and "password = vbNullString" in macro,
              "sincronizza modifiche Excel con snapshot": "LoadSyncSnapshot(snapshotWs)" in macro and "ExcelRowMatchesSnapshot" in macro and "PatchMovementFromExcel" in macro,
              "scarica il database prima di elaborare le righe Excel": macro.index("Prima scarica il database") < macro.index("For r = headerRow + 1 To lastRow"),
              "conserva il CSV remoto durante i nuovi inserimenti": "remoteCsv = response" in macro and "stm.WriteText remoteCsv" in macro,
              "interrompe sui conflitti prima di sovrascrivere Excel": "ExcelRowMatchesRemote" in macro and "Conflitto sul movimento ID" in macro and "Nessuna delle due versioni è stata sovrascritta" in macro,
              "inserisce nuovi movimenti e recupera l'ID": '"/rest/v1/" & TABLE_NAME & "?select=id"' in macro and 'JsonGetString(response, "id")' in macro,
              "scarica i movimenti dal database": '"/rest/v1/" & TABLE_NAME & "?select=id,movement_date,concept,category,movement_type,amount,notes&user_id=eq."' in macro,
              "non cancella movimenti": "cancellato" in macro and "DELETE" not in macro,
              "preserva le colonne calcolate Excel": "RebuildDerivedColumns" not in macro,
              "converte date ISO senza dipendere dalla lingua di Excel": "IsoDateValue(CStr(tmpWs.Cells(ar, apiHdr(\"movement_date\")).Value))" in macro and "DateSerial(CInt(Left$(s, 4))" in macro,
              "ripristina lo stato di Excel anche in caso di errore": "Fail:" in macro and "Application.EnableEvents = oldEvents" in macro,
          }
          for label, ok in checks.items():
              print(("OK" if ok else "ERRORE") + " - " + label)
          failed = [label for label, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("Verifica macro diretta fallita: " + "; ".join(failed))
          PY

      - name: Verifica macro Excel per sincronizzazione inversa
        shell: bash
        run: |
          set -euo pipefail
          MACRO="test-source/AggiornaMovimentiDaApp.bas"
          test -f "$MACRO"
          python3 - <<'PY'
          from pathlib import Path
          macro = Path("test-source/AggiornaMovimentiDaApp.bas").read_text(encoding="utf-8")
          checks = {
              "usa foglio Movimenti": 'Worksheets("Movimenti")' in macro,
              "seleziona CSV esportato dall'app": 'GetOpenFilename("File CSV' in macro,
              "aggiorna righe tramite ID stabile": 'idRows.Exists(movementId)' in macro,
              "aggiunge nuovi movimenti senza ID duplicati": 'idRows.Add movementId, destRow' in macro,
              "ignora righe senza ID": 'If Len(movementId) > 0 Then' in macro,
              "non elimina righe assenti dal CSV": 'non sono state eliminate' in macro,
              "mappa colonne per intestazione": 'tgtHeaders.Exists(CStr(key))' in macro,
              "gestisce errori e ripristina Excel": 'Application.EnableEvents = True' in macro and 'Fail:' in macro,
          }
          for label, ok in checks.items():
              print(("OK" if ok else "ERRORE") + " - " + label)
          failed = [label for label, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("Verifica macro fallita: " + "; ".join(failed))
          PY

      - name: Conserva il pacchetto verificato come artefatto di prova
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Bilancio-Casa-test-sync-bidirezionale
          path: |
            Bilancio_Casa_PWA_v0_2_0.zip
            extracted/bilancio-casa-pwa/app.js
          if-no-files-found: error
          retention-days: 7
